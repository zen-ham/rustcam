[build-system]
requires      = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name            = "rustcam"
description     = "Rust-backed Windows DXGI Desktop Duplication API screen capture for Python."
readme          = "README.md"
requires-python = ">=3.9"
license         = { text = "MIT" }
authors         = [{ name = "zen-ham" }]
keywords        = ["screen-capture", "dda", "dxgi", "windows", "directx", "screenshot", "bettercam"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "numpy>=1.21",
]
dynamic = ["version"]

[project.urls]
Homepage   = "https://github.com/zen-ham/rustcam"
Repository = "https://github.com/zen-ham/rustcam"
Issues     = "https://github.com/zen-ham/rustcam/issues"

[tool.maturin]
module-name   = "rustcam._rustcam"
python-source = "python"
bindings      = "pyo3"
features      = ["pyo3/abi3-py39"]
strip         = true
